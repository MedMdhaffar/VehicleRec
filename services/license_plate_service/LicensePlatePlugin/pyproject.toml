[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waycon-license-plate-plugin"
version = "0.1.0"
description = "Frozen DINOv3 R2 and Arabic OCR Tunisian plate-category classifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "Pillow",
  "torch",
  "paddleocr",
  "paddlepaddle"
]

[project.scripts]
license-plate-plugin = "license_plate_plugin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["license_plate_plugin*"]

