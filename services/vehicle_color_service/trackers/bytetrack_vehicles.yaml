# ByteTrack tuned for wide-area CCTV vehicle tracking + line counting.
# Goal: keep a vehicle's track_id STABLE across the counting line (fewer
# re-IDs → less biased counts), by (a) feeding low-confidence detections so
# the 2-stage BYTE association can sustain a track through weak frames, and
# (b) keeping lost tracks alive longer to bridge brief occlusions.
#
# Pair with a LOW detector feed conf (live_feed.config.TRACK_CONF ≈ 0.10) so
# boxes between track_low_thresh and track_high_thresh actually reach stage 2.
tracker_type: bytetrack
track_high_thresh: 0.30 # first-stage: confident detections start the association
track_low_thresh: 0.10  # second-stage: marginal boxes recover tracks (the BYTE trick) — must be ≥ feed conf
new_track_thresh: 0.25  # need a reasonably confident detection to START a track (suppress junk from low feed)
track_buffer: 75        # keep a lost vehicle ~3.7s @20fps → re-associate to same ID instead of a new one
match_thresh: 0.80      # association IoU/cost threshold
fuse_score: True        # fuse detection score with motion/IoU — stabilizes weak detections
